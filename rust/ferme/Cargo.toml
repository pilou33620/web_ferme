[package]
name = "ferme"
version = "0.1.0"
edition = "2021"
description = "La Ferme du Val Vert : le moteur du jeu (cultures, bêtes, saisons, atelier) et son serveur local"

[lib]
doctest = false

[dependencies]
# les clés JSON gardent leur ordre, comme en Python ; float_roundtrip : un flottant relu est, au bit près, celui qui a été écrit
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"    # random.Random("texte") : la graine passe par SHA-512, comme en Python
ctrlc = { version = "3", features = ["termination"] }   # SIGTERM et Ctrl+C : la partie est écrite avant de sortir
# Serveur HTTP/HTTPS et appairage : communs aux web tools (dépôt web_suite), à la place de http.server et d'appairage.py
# feature production : mise à jour sans git de la copie de production (archive web_ferme-prod)
web_tools_commun = { git = "https://github.com/pilou33620/web_suite", rev = "a9d9d90638718302b92ee862bbd415c16bb218fc", features = ["production"] }
